name: NAS-Image

# Baut nach jeder Änderung auf main das fertige Paket für die Synology und legt es in die
# GitHub Container Registry (ghcr.io). Auf der NAS holt Watchtower es automatisch ab (docs/synology.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server-Tests
        run: |
          pip install -r server/requirements-dev.txt
          cd server && python -m pytest -q
      - name: Oberfläche prüfen
        run: for f in app.js store.js lookup.js sw.js; do node --check "$f"; done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sindoma-bot/kitapligim:latest
            ghcr.io/sindoma-bot/kitapligim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
