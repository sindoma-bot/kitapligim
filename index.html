<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitaplığım</title>
<meta name="description" content="Kişisel kitap kataloğu: raflar, notlar, barkodla ekleme, ödünç takibi.">
<meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a211e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitaplığım">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
<aside class="side" id="side" aria-label="Gezinme">
  <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5C5.5 4.6 8.6 4.8 11 6.2v13.3c-2.4-1.3-5.5-1.5-8-.6zM21 5.5c-2.5-.9-5.6-.7-8 .7v13.3c2.4-1.3 5.5-1.5 8-.6z"/></svg>Kitaplığım</div>
  <nav class="nav" id="nav"></nav>
  <div class="navh">Raflar <button class="navadd" id="navShelfAdd" aria-label="Raf ekle">+</button></div>
  <nav class="nav" id="navShelves"></nav>
  <button class="navitem navsettings" id="btnSettings2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Ayarlar ve yedek</span></button>
</aside>
<div class="maincol">
<header class="top">
  <svg class="deco" viewBox="0 0 220 150" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <path d="M150 112c-6-30-2-58 10-84" stroke="#5f7d5a" stroke-width="2.5"/>
      <path d="M160 28c10-6 22-6 30 0-9 7-20 8-30 0z" fill="#7f9c74"/>
      <path d="M156 50c-12-8-26-8-34-1 10 8 24 9 34 1z" fill="#6d8a63"/>
      <path d="M154 70c11-9 26-10 35-3-10 9-25 10-35 3z" fill="#88a47c"/>
      <path d="M151 90c-11-6-24-5-31 2 9 6 22 6 31-2z" fill="#6d8a63"/>
      <path d="M170 112c4-22 14-40 30-52" stroke="#5f7d5a" stroke-width="2"/>
      <path d="M196 62c8-2 15 1 18 7-8 2-15 0-18-7z" fill="#7f9c74"/>
      <path d="M183 82c9 0 15 4 17 10-8 1-15-3-17-10z" fill="#88a47c"/>
    </g>
    <path d="M136 108h52l-6 34h-40z" fill="#c9b79a"/><path d="M134 104h56v8h-56z" fill="#b8a383"/>
    <rect x="30" y="128" width="96" height="14" rx="2" fill="#7a5a3a"/>
    <rect x="38" y="116" width="84" height="12" rx="2" fill="#2f5d46"/>
    <rect x="34" y="104" width="78" height="12" rx="2" fill="#b8862b"/>
    <rect x="42" y="132" width="70" height="2" fill="#f2e6d0" opacity=".6"/>
    <rect x="48" y="120" width="60" height="2" fill="#f2e6d0" opacity=".5"/>
  </svg>
  <div class="wrap">
    <div class="titlebar">
      <div class="ttl">
        <h1>Kitaplığım</h1>
        <div class="count" id="countline">Kitaplar yükleniyor…</div>
      </div>
      <div class="search" id="searchRow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Kitap, yazar, yayınevi veya notlarda ara…" autocomplete="off" enterkeyhint="search">
      </div>
      <button class="iconbtn" id="btnSettings" aria-label="Ayarlar ve yedekleme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
      <button class="btn primary addbtn" id="btnAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Kitap ekle</span></button>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Raflar"></div>
    <div class="statusrow" id="statusRow" role="toolbar" aria-label="Okuma durumu"></div>
    <div class="actions">
      <div class="seg" role="group" aria-label="Görünüm">
        <button id="viewGrid" aria-label="Kapak görünümü" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
        <button id="viewList" aria-label="Liste görünümü" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>
      <button class="btn" id="btnSelect" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Seç</button>
      <label class="btn" for="sortSel"><span class="lbl">Sırala:</span>
        <select id="sortSel" aria-label="Sırala">
          <option value="title">Başlık A–Z</option>
          <option value="author">Yazar A–Z</option>
          <option value="added">Son eklenen</option>
          <option value="year">Yayın yılı</option>
          <option value="rating">Puan</option>
        </select>
      </label>
      <button class="btn" id="btnSearch" hidden>Ara</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="readingNow" class="reading" hidden></section>
  <div id="sampleBanner" class="banner" hidden>
    <span>Gördüğün kitaplar örnek. Kendi kitaplarını ekleyince bunları silebilirsin.</span>
    <button class="btn" id="btnClearSamples">Örnekleri sil</button>
  </div>
  <div id="installHint" class="banner" hidden></div>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty" hidden></div>
</main>
</div>
</div>

<button class="fab" id="fabScan" aria-label="Barkod okut">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
</button>

<div class="selbar" id="selbar" hidden>
  <div class="wrap">
    <strong id="selCount">0 seçili</strong>
    <button class="btn" id="selAll">Tümünü seç</button>
    <select id="selShelf" aria-label="Raf seç"></select>
    <button class="btn" id="selApply">Rafa ekle</button>
    <button class="btn" id="selUnshelf">Raftan çıkar</button>
    <button class="btn danger" id="selDelete">Sil</button>
  </div>
</div>

<div id="sheetRoot"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="sr" tabindex="-1">
<input type="file" id="photoInputLib" accept="image/*" class="sr" tabindex="-1">
<input type="file" id="csvInput" accept=".csv,text/csv,text/plain" class="sr" tabindex="-1">
<input type="file" id="jsonInput" accept=".json,application/json" class="sr" tabindex="-1">
<div id="toast" class="toast" role="status" hidden></div>

<script src="store.js"></script>
<script src="lookup.js"></script>
<script src="app.js"></script>
</body>
</html>
